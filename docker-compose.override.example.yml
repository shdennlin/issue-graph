# Copy this file to docker-compose.override.yml when you need the design-doc
# scanner to reach a repo on the host. Compose merges
# docker-compose.override.yml with docker-compose.yml automatically.
#
# REPO_PATH is a single server-wide setting — there is no per-workspace repo
# path. (A path stored per workspace would have to be editable from the setup
# form, and a form field aiming a filesystem scanner at any absolute path is a
# file-read primitive in an app with no authentication.) So there is exactly
# one repo to mount, and it must be at the SAME absolute path inside the
# container as on the host, so one REPO_PATH value works for both
# `bun run dev` and Compose.
#
# Leave REPO_PATH unset and skip this file entirely to disable design-doc
# scanning — the right choice on a server where the repo is not checked out.
#
# Example .env:
#   REPO_PATH=/Users/you/workspace/proj-a

services:
  app:
    volumes:
      # Keep the base data volume from docker-compose.yml.
      - ./data:/app/data

      # Same path on both sides. Read-only: the scanner never writes.
      - /Users/you/workspace/proj-a:/Users/you/workspace/proj-a:ro
