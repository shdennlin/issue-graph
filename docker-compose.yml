services:
  app:
    build: .
    image: issue-graph:latest
    container_name: issue-graph
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-31415}:31415"
    volumes:
      - ./data:/app/data
      # REPO_PATH (from .env) is bind-mounted at the same absolute path inside
      # the container, so the backend's REPO_PATH env var works identically in
      # local dev and Docker. Default points at a placeholder so the design-doc
      # adapter stays disabled when REPO_PATH is unset.
      - ${REPO_PATH:-./.docker/empty-repo}:${REPO_PATH:-/var/empty/issue-graph-no-repo}:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:31415/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
